name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy public values so the build passes; real ones live in Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      # A canary: the build must never put it into anything a browser downloads (checked right after the build).
      ANTHROPIC_API_KEY: sk-ant-ci-canary-0000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: The Anthropic key must not be in the client bundle
        run: npm run check:bundle

  # Row-level security tests: try to read and write other users' rows against a real local Supabase stack.
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (database + auth only)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,storage-api,realtime,supavisor,mailpit,postgres-meta
      - run: npm run test:rls
